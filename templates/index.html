<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkWeb</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>LinkWeb</h1>
            <div id="clock" class="clock">--:--:--</div>
        </div>

        <form method="POST" action="{{ url_for('add') }}" class="add-form">
            <input type="text" name="name" placeholder="Name" required>
            <input type="url" name="url" placeholder="https://..." required>
            <button type="submit">Add</button>
        </form>

        <ul class="link-list" id="link-list">
            {% for link in links %}
            <li class="link-item{% if link['favorite'] %} favorited{% endif %}" data-id="{{ link['id'] }}">
                <div class="link-row">
                    <div class="drag-handle" aria-hidden="true">⠿</div>
                    <div class="link-left">
                        <div class="link-info">
                            <a href="{{ link['url'] }}" target="_blank" rel="noopener" class="link-name">{{ link['name'] }}</a>
                            <a href="{{ link['url'] }}" target="_blank" rel="noopener" class="link-url">{{ link['url'] }}</a>
                        </div>
                        <div class="link-actions">
                            <button class="btn-edit" onclick="toggleEdit(this)">Edit</button>
                            <form method="POST" action="{{ url_for('delete', link_id=link['id']) }}" class="delete-form">
                                <button type="submit" class="btn-delete" onclick="return confirm('Remove this link?')">Remove</button>
                            </form>
                        </div>
                    </div>
                    <form method="POST" action="{{ url_for('favorite', link_id=link['id']) }}" class="fav-form">
                        <button type="submit" class="btn-fav" title="{% if link['favorite'] %}Unfavorite{% else %}Favorite{% endif %}" aria-label="{% if link['favorite'] %}Unfavorite{% else %}Favorite{% endif %}">{{ '★' if link['favorite'] else '☆' }}</button>
                    </form>
                    <a href="{{ link['url'] }}" target="_blank" rel="noopener" class="btn-open">Open</a>
                </div>
                <form method="POST" action="{{ url_for('edit', link_id=link['id']) }}" class="edit-form hidden">
                    <input type="text" name="name" value="{{ link['name'] }}" required>
                    <input type="url" name="url" value="{{ link['url'] }}" required>
                    <div class="edit-actions">
                        <button type="submit" class="btn-save">Save</button>
                        <button type="button" class="btn-cancel" onclick="toggleEdit(this)">Cancel</button>
                    </div>
                </form>
            </li>
            {% else %}
            <li class="empty">No links yet. Add one above.</li>
            {% endfor %}
        </ul>
    </div>

    <script>
        function toggleEdit(btn) {
            var item = btn.closest('.link-item');
            item.querySelector('.link-actions').classList.toggle('hidden');
            item.querySelector('.edit-form').classList.toggle('hidden');
        }

        var clockOffset = 0;

        function syncClock() {
            var t0 = Date.now();
            fetch("https://time.google.com", { method: "HEAD", cache: "no-store" })
                .then(function(res) {
                    var t1 = Date.now();
                    var serverTime = new Date(res.headers.get("Date")).getTime();
                    var roundTrip = t1 - t0;
                    clockOffset = serverTime + roundTrip / 2 - t1;
                })
                .catch(function() {});
        }

        function updateClock() {
            var now = new Date(Date.now() + clockOffset);
            var h = String(now.getHours()).padStart(2, "0");
            var m = String(now.getMinutes()).padStart(2, "0");
            var s = String(now.getSeconds()).padStart(2, "0");
            var ms = String(Math.floor(now.getMilliseconds() / 100));
            document.getElementById("clock").textContent = h + ":" + m + ":" + s + "." + ms;
        }

        syncClock();
        setInterval(syncClock, 30000);
        setInterval(updateClock, 100);

        var list = document.getElementById("link-list");
        var dragItem = null;
        var placeholder = null;
        var dragGrab = 0;
        var dragHeight = 0;
        var dragGap = 0;
        var pressTimer = null;
        var startY = 0;
        var armed = false;
        var lastOrder = "";
        var scrollRaf = null;
        var pointerY = 0;

        var EDGE = 90;
        var MAX_STEP = 18;

        function items() {
            return Array.prototype.slice.call(list.querySelectorAll(".link-item"));
        }

        function persistOrder() {
            var ids = items().map(function(el) {
                return parseInt(el.dataset.id, 10);
            });
            if (ids.join(",") === lastOrder) return;
            lastOrder = ids.join(",");
            fetch("{{ url_for('reorder') }}", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(ids)
            });
        }

        function beginDrag(el, clientY) {
            var rect = el.getBoundingClientRect();
            dragItem = el;
            dragGrab = clientY - rect.top;
            dragHeight = rect.height;
            dragGap = parseFloat(window.getComputedStyle(el).marginBottom) || 0;

            placeholder = document.createElement("li");
            placeholder.className = "drop-placeholder";
            placeholder.style.height = rect.height + "px";
            list.insertBefore(placeholder, el.nextSibling);

            el.classList.add("dragging");
            el.style.position = "fixed";
            el.style.left = rect.left + "px";
            el.style.top = rect.top + "px";
            el.style.width = rect.width + "px";
            el.style.marginBottom = "0";
            document.body.classList.add("reordering");
        }

        // The dragged card is position:fixed, so the list keeps its height and
        // only the placeholder moves around. The slot is picked by comparing the
        // pointer against the other cards' midpoints measured as if the
        // placeholder were not there -- that makes the result a pure function of
        // the pointer, so the placeholder can never oscillate or skip a slot.
        function placeDragged() {
            if (!dragItem) return;
            var top = pointerY - dragGrab;
            dragItem.style.top = top + "px";
            var center = top + dragHeight / 2;

            var phRect = placeholder.getBoundingClientRect();
            var phSlot = phRect.height + dragGap;

            var nodes = items().filter(function(el) {
                return el !== dragItem;
            });

            var target = null;
            for (var i = 0; i < nodes.length; i++) {
                var r = nodes[i].getBoundingClientRect();
                var mid = r.top + r.height / 2;
                if (r.top > phRect.top) mid -= phSlot;
                if (center > mid) target = nodes[i];
            }

            if (target) {
                if (placeholder !== target.nextSibling) {
                    list.insertBefore(placeholder, target.nextSibling);
                }
            } else if (nodes.length && placeholder !== nodes[0]) {
                list.insertBefore(placeholder, nodes[0]);
            }
        }

        function autoScrollSpeed() {
            var h = window.innerHeight;
            if (pointerY < EDGE) {
                return -Math.min(MAX_STEP, Math.ceil((EDGE - pointerY) / 5));
            }
            if (pointerY > h - EDGE) {
                return Math.min(MAX_STEP, Math.ceil((pointerY - (h - EDGE)) / 5));
            }
            return 0;
        }

        function scrollStep() {
            var speed = autoScrollSpeed();
            if (speed === 0 || !dragItem) {
                scrollRaf = null;
                return;
            }
            window.scrollBy(0, speed);
            placeDragged();
            scrollRaf = requestAnimationFrame(scrollStep);
        }

        function updateAutoScroll() {
            if (autoScrollSpeed() === 0) {
                if (scrollRaf !== null) {
                    cancelAnimationFrame(scrollRaf);
                    scrollRaf = null;
                }
                return;
            }
            if (scrollRaf === null) {
                scrollRaf = requestAnimationFrame(scrollStep);
            }
        }

        function endDrag() {
            if (!dragItem) return;
            if (scrollRaf !== null) {
                cancelAnimationFrame(scrollRaf);
                scrollRaf = null;
            }

            if (placeholder) {
                list.insertBefore(dragItem, placeholder);
                placeholder.parentNode.removeChild(placeholder);
                placeholder = null;
            }

            dragItem.classList.remove("dragging");
            dragItem.style.position = "";
            dragItem.style.left = "";
            dragItem.style.top = "";
            dragItem.style.width = "";
            dragItem.style.marginBottom = "";
            document.body.classList.remove("reordering");
            dragItem = null;

            persistOrder();
        }

        function onMove(e) {
            if (!armed) {
                if (pressTimer && Math.abs(e.clientY - startY) > 6) {
                    clearTimeout(pressTimer);
                    pressTimer = null;
                }
                return;
            }
            e.preventDefault();
            pointerY = e.clientY;
            placeDragged();
            updateAutoScroll();
        }

        function onRelease() {
            clearTimeout(pressTimer);
            pressTimer = null;
            window.removeEventListener("pointermove", onMove);
            window.removeEventListener("pointerup", onRelease);
            window.removeEventListener("pointercancel", onRelease);
            if (armed) {
                armed = false;
                endDrag();
            }
        }

        list.addEventListener("pointerdown", function(e) {
            if (e.button !== 0) return;
            var item = e.target.closest(".link-item");
            if (!item) return;
            if (e.target.closest("a, button, input, form")) return;
            if (e.pointerType !== "mouse" && !e.target.closest(".drag-handle")) return;

            startY = e.clientY;
            pointerY = e.clientY;
            armed = e.pointerType === "mouse";
            if (armed) beginDrag(item, startY);

            pressTimer = setTimeout(function() {
                if (armed) return;
                armed = true;
                beginDrag(item, startY);
            }, 60);

            window.addEventListener("pointermove", onMove, { passive: false });
            window.addEventListener("pointerup", onRelease);
            window.addEventListener("pointercancel", onRelease);
        });
    </script>
</body>
</html>
